# Version Catalog —— 全工程依赖版本的单一真源。
# iOS 对照：≈ 把 Package.swift 里所有 .package(url:from:) 抽到一个集中清单。
# S0 只放模板 App 所需的最小集；后续阶段按需增量添加。

[versions]
agp = "9.2.1"
kotlin = "2.3.20"
composeBom = "2025.06.00"
coreKtx = "1.10.1"
material = "1.10.0"
# S1 新增：DI 与导航（版本于 2026-07-13 联网核实）
ksp = "2.3.9"          # KSP2：版本已与 Kotlin 解耦；KSP1 不兼容 Kotlin 2.3+/AGP 9+
hilt = "2.60.1"        # Hilt 2.59 起才支持 AGP 9（配套要求 Gradle 9.1+，本工程 9.4.1 满足）
hiltNavigationCompose = "1.3.0" # 1.4.0 要求 compileSdk 37；本工程保持 36.1
activityCompose = "1.8.2"
navigationCompose = "2.9.0"
lifecycle = "2.9.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.8.1"
coroutines = "1.10.2"
junit = "4.13.2"

[libraries]
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# Material Components：XML 主题 Theme.Material3.* 的资源提供方（Manifest 主题需要）
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Compose UI 库由 BOM 定版；Activity、Navigation、Lifecycle 独立定版
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# S1 新增：Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# S1 新增：导航与 ViewModel（不由 Compose BOM 管理）
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
